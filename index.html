<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NODE — Gear Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<header class="site">
  <div class="header-inner">
    <div class="logo" data-action="nav" data-view="catalog">NODE<span class="tag">// gear catalog</span></div>
    <div class="search-wrap">
      <span class="prompt">&gt;</span>
      <input type="text" id="searchInput" placeholder="search catalog...">
    </div>
    <nav class="nav-links">
      <button data-action="nav" data-view="catalog">Catalog</button>
      <button data-action="nav" data-view="wishlist">Wishlist</button>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" data-action="open-admin" title="Admin dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      </button>
      <button class="icon-btn" data-action="nav" data-view="wishlist" title="Wishlist">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"/></svg>
        <span class="badge" id="wishBadge" style="display:none">0</span>
      </button>
      <button class="icon-btn" data-action="nav" data-view="cart" title="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="badge" id="cartBadge" style="display:none">0</span>
      </button>
    </div>
  </div>
  <div class="cat-strip" id="catStrip"></div>
</header>

<main id="app"></main>

<div class="toast" id="toast"><span class="dot" style="width:6px;height:6px;border-radius:50%;"></span><span id="toastMsg"></span></div>

<nav class="bottom-nav" id="bottomNav">
  <button data-action="nav" data-view="catalog" data-bnav="catalog">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
    <span>Home</span>
  </button>
  <button data-action="focus-search" data-bnav="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <span>Search</span>
  </button>
  <button data-action="nav" data-view="cart" data-bnav="cart" style="position:relative;">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
    <span>Cart</span>
    <span class="badge" id="cartBadgeMobile" style="display:none">0</span>
  </button>
  <button data-action="nav" data-view="wishlist" data-bnav="wishlist" style="position:relative;">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"/></svg>
    <span>Saved</span>
    <span class="badge" id="wishBadgeMobile" style="display:none">0</span>
  </button>
</nav>

<script src="script.js" defer></script>
</body>
</html>
